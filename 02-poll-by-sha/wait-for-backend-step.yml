# Adds the actual poll. Still missing: the grace window for "run
# not registered yet" (stage 03) and meaningful error surfacing
# (stage 04). Shipping this stage alone catches the race in most
# cases but false-proceeds when GitHub is slow to register the
# backend workflow run.

permissions:
  contents: read
  actions: read

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Wait for backend deploy on same commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          if ! echo "$changed" | grep -qE "^(backend/|infra/|\.github/workflows/deploy-backend\.yml$)"; then
            echo "No backend/infra changes — proceeding."
            exit 0
          fi
          echo "Backend changes detected — waiting on deploy-backend.yml for ${GITHUB_SHA}."

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-backend.yml/runs"
          query="head_sha=${GITHUB_SHA}&per_page=1"

          # 160 × 15s = 40 min outer ceiling. A backend deploy that
          # takes longer than that is broken; fail fast rather than
          # let the frontend ship.
          for i in $(seq 1 160); do
            payload=$(curl -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}?${query}")
            status=$(echo "$payload" | jq -r '.workflow_runs[0].status // empty')
            conclusion=$(echo "$payload" | jq -r '.workflow_runs[0].conclusion // empty')

            if [ -z "$status" ]; then
              # No run on this SHA. Without a grace window this is the
              # bug — see stage 03.
              echo "No backend run on this SHA — proceeding."
              exit 0
            fi
            if [ "$status" = "completed" ]; then
              case "$conclusion" in
                success|skipped)
                  echo "Backend deploy ${conclusion} — proceeding."
                  exit 0
                  ;;
                *)
                  echo "::error::Backend deploy ${conclusion}."
                  exit 1
                  ;;
              esac
            fi
            echo "Backend deploy ${status} (poll ${i}/160) — sleeping 15s."
            sleep 15
          done
          echo "::error::Timed out waiting for backend deploy."
          exit 1
