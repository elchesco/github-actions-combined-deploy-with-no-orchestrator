name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      # Build container, push to ECR, run alembic, roll the ECS service.
      # Elided for the post — pick your favourite stack.
      - run: ./scripts/deploy-backend.sh
